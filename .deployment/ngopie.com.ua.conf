<VirtualHost *:80>
    ServerName ngopie.com.ua
    ServerAlias www.ngopie.com.ua
    DocumentRoot /var/www/ngopie.com.ua/public_html

    ErrorLog /var/www/ngopie.com.ua/error.log
    CustomLog /var/www/ngopie.com.ua/requests.log combined

    <Directory /var/www/ngopie.com.ua/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /.well-known/acme-challenge/ /var/www/ngopie.com.ua/.well-known/acme-challenge/
    <Directory /var/www/ngopie.com.ua/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
